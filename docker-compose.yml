
services:
  ai-tts:
    build:
      context: .
      args:
        PRELOAD_MODELS: "false"
    container_name: ai-ASR
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - ASR_MODEL=${ASR_MODEL:-persian-v4}
    ports:
      - "5016:5016"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./hf-cache:/app/hf-cache   # persist HF/transformers cache
    networks:
      - localnet

  ui:
    build:
      context: .
      args:
        PRELOAD_MODELS: "false"
    container_name: ai-ASR-ui
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - ASR_API_URL=http://ai-tts:5016/api/inference/
      - ASR_API_TIMEOUT=600
    command: python3 -m ui.gradio_app
    ports:
      - "7860:7860"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./ui:/app/ui
      - ./hf-cache:/app/hf-cache   # share the same cache with API
    networks:
      - localnet

networks:
  localnet:
    driver: bridge
